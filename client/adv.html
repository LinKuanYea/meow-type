<!DOCTYPE html>
<html lang="zh-Hant-TW" data-v="__APP_VERSION__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冒險模式・喵打</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="/style.css?v=__APP_VERSION__">
<script src="/boot.js?v=__APP_VERSION__"></script>
<script type="module" src="/adv.js?v=__APP_VERSION__"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>喵打冒險</h1><p class="sub">打字就是攻擊！打倒每一關的怪物，收集小魚乾和裝扮。</p></div>
    <div class="advtop"><span class="fish" id="fish" hidden></span><button type="button" class="acctbtn" id="goCloset">換裝</button><a class="acctbtn" href="/">一般練習</a><div class="acct" id="acct" hidden></div></div>
  </div>

  <section id="map">
    <div class="seg islands" id="islands"></div>
    <p class="hint" id="mapHint"></p>
    <div id="chapters"></div>
  </section>

  <section id="play" hidden>
    <div class="playhead"><button type="button" class="link" id="back">← 回地圖</button><h2 id="lvName"></h2></div>
    <canvas id="arena" class="arena" aria-label="戰鬥畫面：打對字貓就攻擊怪物"></canvas>
    <div class="live">
      <div><small>速度（WPM）</small><strong id="ls">0</strong></div>
      <div><small>正確率</small><strong id="la">100%</strong></div>
      <div><small>時間（秒）</small><strong id="lt">0.0</strong></div>
      <div><small>三星目標</small><strong id="lg">0</strong></div>
    </div>
    <div class="box" id="box">
      <div id="txt"></div>
      <textarea id="ta" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="打字輸入"></textarea>
      <div id="comp"></div>
      <div class="cover">點這裡開始打字</div>
    </div>
    <p class="hint" id="hint">Tab 縮排（補到 4 的倍數）・Esc 重來這一關・不能貼上</p>
    <section id="res" hidden></section>
  </section>

  <section id="closet" hidden>
    <div class="playhead"><button type="button" class="link" id="back2">← 回地圖</button><h2>換裝與圖鑑</h2></div>
    <div class="closet">
      <div class="preview"><canvas id="preview" width="224" height="196" aria-label="你的貓"></canvas><p class="hint" id="closetHint"></p></div>
      <div id="slots"></div>
    </div>
  </section>

  <div class="ver"><span>__APP_VERSION_LABEL__</span><a href="/privacy">隱私權政策</a><a href="/terms">服務條款</a></div>
</div>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
